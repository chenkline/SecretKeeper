<rect x="0" y="108" width="390" height="731" rx="0" fill="none"/>
<text font-family="Noto Sans SC, sans-serif" font-size="13" font-weight="400" fill="#718087" text-anchor="start" x="20" y="130.56">在本机生成一把随机 RSA-2048 主密钥。</text>
<rect x="20" y="151" width="350" height="97" rx="0" fill="none"/>
