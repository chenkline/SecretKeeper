name: CNG 能力探测（一次性）
# 一次性诊断 workflow：确认目标环境的 CNG 能力。
# 结果只作为参考输出，不参与门禁——真正的门禁在 ci.yml。
on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: "43 4 * * 1"
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 探测 CNG 非对称算法可用性
        shell: pwsh
        run: |
          # 探测脚本退出码 2 表示「本机缺少非对称 CNG」，这是信息而非失败，
          # 不应让整个 workflow 变红。真正的构建与测试由 ci.yml 负责。
          python scripts/probe-cng.py
          if ($LASTEXITCODE -eq 2) {
            Write-Host "::notice::本机 CNG 不提供非对称算法（RSA/ECC/DH）"
            exit 0
          }
          exit $LASTEXITCODE
