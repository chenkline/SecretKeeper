name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每日定时全量构建，用于发现上游依赖的破坏性变更
    - cron: "17 3 * * *"

jobs:
  # ---------- 黄金测试向量校验（关键路径）----------
  vectors:
    name: 向量校验
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验向量自洽性
        run: python scripts/verify-vectors.py
      # 注意：不能用「重新生成后 git diff」检测向量是否被改动。
      # gen-vectors.py 中 GCM nonce 与 RSA-OAEP 种子均为随机，每次生成必然不同，
      # diff 永远失败。向量一旦提交即视为基准，任何变更必须人工评审后显式重新生成。


  # ---------- Windows ----------
  windows:
    name: Windows (C++/WinUI3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 定位 MSVC 环境
        shell: pwsh
        run: |
          # runner 镜像里的 VS 版本与 SKU 会随镜像更新变化（Enterprise /
          # Community / Professional 都出现过），写死路径迟早会失效。
          # 因此优先用官方的 vswhere 查询，失败再退回递归搜索。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsdev = $null
          if (Test-Path $vswhere) {
            $install = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if ($install) {
              $candidate = Join-Path $install "Common7\Tools\VsDevCmd.bat"
              if (Test-Path $candidate) { $vsdev = $candidate }
            }
          }
          if (-not $vsdev) {
            $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
            if (Test-Path $root) {
              $vsdev = Get-ChildItem -Path $root -Filter VsDevCmd.bat `
                -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\Common7\\Tools\\VsDevCmd\.bat$" } |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if (-not $vsdev) {
            Write-Host "::error::未找到 VsDevCmd.bat，MSVC 环境不可用"; exit 1
          }
          "VSDEVCMD=$vsdev" >> $env:GITHUB_ENV
          Write-Host "MSVC: $vsdev"
      - name: 编译四层自检程序
        shell: cmd
        run: |
          call "%VSDEVCMD%"
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/build.ps1 -Test -CompileOnly
      - name: 执行四层自检
        shell: cmd
        run: |
          call "%VSDEVCMD%"
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/run-tests.ps1 -Architecture x64 -Root .

      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crypto-test
          path: windows/build/
          if-no-files-found: ignore

  # ---------- Windows ARM64 ----------
  # 本机 BuildTools 缺 VC.Tools.ARM64 组件，且用户禁止在开发机上安装任何
  # 新组件，因此 ARM64 交叉编译完全交给 runner。
  #
  # runner 镜像是否预装 ARM64 交叉工具链并无可靠保证（镜像曾出现过只有 x64
  # 工具、链接 aarch64-pc-windows-msvc 失败的情况），所以这里不假设预装：
  # 先探测，缺失再用 VS 安装器补装该组件。该操作是幂等的 modify。
  windows-arm64:
    name: Windows ARM64 (交叉编译)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 确保 ARM64 交叉工具链
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if ($install) {
            Write-Host "ARM64 tools already installed: $install"
            "ARM64READY=true" >> $env:GITHUB_ENV
            exit 0
          }
          Write-Host "::notice::ARM64 工具缺失，正在通过 VS 安装器补装（幂等 modify）"
          $installer = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            Write-Host "::error::找不到 vs_installer.exe，无法补装 ARM64 工具"
            exit 1
          }
          & $installer modify `
            --installPath $install `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --quiet --norestart --nocache
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::补装 ARM64 工具失败，退出码 $LASTEXITCODE"
            exit 1
          }
          "ARM64READY=true" >> $env:GITHUB_ENV
      - name: 定位 MSVC 环境
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if (-not $install) {
            Write-Host "::error::补装后仍找不到带 ARM64 工具的 VS 实例"
            exit 1
          }
          $vsdev = Join-Path $install "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsdev)) {
            Write-Host "::error::未找到 VsDevCmd.bat"
            exit 1
          }
          "VSDEVCMD=$vsdev" >> $env:GITHUB_ENV
          Write-Host "MSVC(arm64): $vsdev"
      - name: 交叉编译四层自检程序
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=arm64 -host_arch=x64
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/build.ps1 -Architecture arm64 -CompileOnly
      - name: 上传交叉编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-build
          path: windows/build/
          if-no-files-found: ignore

  # ---------- Windows UI (WinUI 3) ----------
  # UI 工程只能在带完整 VS + Windows App SDK + MSIX 工具链的 runner 上构建。
  # 本机 BuildTools 缺这些组件且约定不补装，因此 UI 构建完全交给 CI。
  windows-ui:
    name: Windows UI (WinUI 3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 定位 MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.Component.MSBuild `
            -property installationPath
          if (-not $install) {
            Write-Host "::error::未找到 MSBuild"; exit 1
          }
          $msbuild = Join-Path $install "MSBuild\Current\Bin\MSBuild.exe"
          "MSBUILD=$msbuild" >> $env:GITHUB_ENV
          Write-Host "MSBuild: $msbuild"
          # 探测本镜像实际安装了哪些平台工具集。runner 镜像的 VS 版本会变，
          # 写死 v143 在某些镜像上会报 MSB8020（工具集找不到）。
          $vcRoot = Join-Path $install "VC\Tools\MSVC"
          if (Test-Path $vcRoot) {
            $sets = Get-ChildItem $vcRoot -Directory | Select-Object -ExpandProperty Name
            Write-Host "installed MSVC tool dirs: $($sets -join ', ')"
          }
          # 真实的平台工具集名在 Platforms\<平台>\PlatformToolsets\ 下，
          # 与 VC\Tools\MSVC\<版本号> 不是一回事。写死 v143 会在镜像上
          # 报 MSB8020/MSB8003，必须探测后传给 MSBuild。
          $platSets = Join-Path $install "MSBuild\Microsoft\VC\v170\Platforms"
          if (Test-Path $platSets) {
            $x64Sets = Join-Path $platSets "x64\PlatformToolsets"
            if (Test-Path $x64Sets) {
              $sets = Get-ChildItem $x64Sets -Directory | Select-Object -ExpandProperty Name
              Write-Host "x64 platform toolsets: $($sets -join ', ')"
              if ($sets -contains "v143") {
                "TOOLSET=v143" >> $env:GITHUB_ENV
              } elseif ($sets.Count -gt 0) {
                # 取版本号最大的一个（目录名形如 v143、v144）
                $best = $sets | Sort-Object { [int]($_ -replace '[^0-9]','') } | Select-Object -Last 1
                Write-Host "fallback toolset: $best"
                "TOOLSET=$best" >> $env:GITHUB_ENV
              }
            }
          }
          if (-not $env:TOOLSET) {
            Write-Host "::error::未探测到可用的平台工具集"
            exit 1
          }
          Write-Host "using PlatformToolset=$env:TOOLSET"
      - name: 还原 NuGet 包
        shell: pwsh
        run: |
          & $env:MSBUILD "windows/src/ui/App.vcxproj" /t:Restore /p:Configuration=Release /v:minimal
      - name: 构建 WinUI 3 应用
        shell: pwsh
        run: |
          & $env:MSBUILD "windows/src/ui/App.vcxproj" `
            /t:Build /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=$env:TOOLSET /m /v:minimal
      - name: 诊断 App SDK 引导与链接项
        if: always()
        shell: pwsh
        run: |
          $pkg = "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk"
          if (Test-Path $pkg) {
            Write-Host "=== App SDK 包目录 ==="
            Get-ChildItem $pkg -Directory | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Host "=== 含 Bootstrap 的文件 ==="
            Get-ChildItem $pkg -Recurse -Include *.h,*.lib,*.dll -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match 'Bootstrap' } |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Host "=== SelfContained 相关 targets 属性 ==="
            Get-ChildItem $pkg -Recurse -Filter *.targets -ErrorAction SilentlyContinue |
              Select-String -Pattern 'SelfContained|Bootstrap' |
              Select-Object -First 40 |
              ForEach-Object { Write-Host "  $($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
          } else {
            Write-Host "::warning::App SDK 包未找到，还原可能失败"
          }
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-build
          path: windows/build/ui/
          if-no-files-found: warn

  # ---------- Linux ----------
  linux:
    name: Linux (C/Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 安装 Qt 与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libssl-dev libsodium-dev libsqlite3-dev
      - name: 构建并测试
        run: |
          if [ -f linux/CMakeLists.txt ]; then
            cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build linux/build
            ctest --test-dir linux/build --output-on-failure
          else
            echo "::notice::linux 工程尚未创建，跳过构建"
          fi


  # ---------- macOS ----------
  macos:
    name: macOS (Swift/AppKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 构建并测试
        run: |
          if [ -d macos ]; then
            swift build --package-path macos -c release
            swift test --package-path macos -c release
          else
            echo "::notice::macos 工程尚未创建，跳过构建"
          fi

  # ---------- Android ----------
  android:
    name: Android (Kotlin/Compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      # 尚未创建 android 工程时不装 SDK —— 装 SDK 要下载数 GB 且需要接受
      # 许可协议，既慢又容易因许可步骤失败而让整个 job 变红，
      # 而此时根本没有东西需要构建。
      - name: 检查 android 工程是否存在
        id: has_android
        run: |
          if [ -f android/gradlew ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::android 工程尚未创建，跳过 SDK 安装与构建"
          fi
      - uses: actions/setup-java@v4
        if: steps.has_android.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 并接受许可协议
        if: steps.has_android.outputs.exists == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: 构建并测试
        if: steps.has_android.outputs.exists == 'true'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug test --no-daemon

  # ---------- iOS ----------
  ios:
    name: iOS (Swift/SwiftUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 构建并测试（未签名）
        run: |
          if [ -d ios ]; then
            xcodebuild build -project ios/ios.xcodeproj -scheme ios \\
              -destination "generic/platform=iOS" -configuration Release \\
              CODE_SIGNING_ALLOWED=NO
          else
            echo "::notice::ios 工程尚未创建，跳过构建"
          fi
