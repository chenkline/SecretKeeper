name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每日定时全量构建，用于发现上游依赖的破坏性变更
    - cron: "17 3 * * *"

jobs:
  # ---------- 黄金测试向量校验（关键路径）----------
  vectors:
    name: 向量校验
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验向量自洽性
        run: python scripts/verify-vectors.py
      # 注意：不能用「重新生成后 git diff」检测向量是否被改动。
      # gen-vectors.py 中 GCM nonce 与 RSA-OAEP 种子均为随机，每次生成必然不同，
      # diff 永远失败。向量一旦提交即视为基准，任何变更必须人工评审后显式重新生成。


  # ---------- Windows ----------
  windows:
    name: Windows (C++/WinUI3)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 定位 MSVC 环境
        shell: pwsh
        run: |
          # runner 镜像里的 VS 版本与 SKU 会随镜像更新变化（Enterprise /
          # Community / Professional 都出现过），写死路径迟早会失效。
          # 因此优先用官方的 vswhere 查询，失败再退回递归搜索。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsdev = $null
          if (Test-Path $vswhere) {
            $install = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if ($install) {
              $candidate = Join-Path $install "Common7\Tools\VsDevCmd.bat"
              if (Test-Path $candidate) { $vsdev = $candidate }
            }
          }
          if (-not $vsdev) {
            $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
            if (Test-Path $root) {
              $vsdev = Get-ChildItem -Path $root -Filter VsDevCmd.bat `
                -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\Common7\\Tools\\VsDevCmd\.bat$" } |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if (-not $vsdev) {
            Write-Host "::error::未找到 VsDevCmd.bat，MSVC 环境不可用"; exit 1
          }
          "VSDEVCMD=$vsdev" >> $env:GITHUB_ENV
          Write-Host "MSVC: $vsdev"
      - name: 构建并测试密码学层
        shell: cmd
        run: |
          call "%VSDEVCMD%"
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/build.ps1 -Test
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crypto-test
          path: windows/build/
          if-no-files-found: ignore

  # ---------- Linux ----------
  linux:
    name: Linux (C/Qt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 安装 Qt 与依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev libssl-dev libsodium-dev libsqlite3-dev
      - name: 构建并测试
        run: |
          if [ -f linux/CMakeLists.txt ]; then
            cmake -S linux -B linux/build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build linux/build
            ctest --test-dir linux/build --output-on-failure
          else
            echo "::notice::linux 工程尚未创建，跳过构建"
          fi


  # ---------- macOS ----------
  macos:
    name: macOS (Swift/AppKit)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 构建并测试
        run: |
          if [ -d macos ]; then
            swift build --package-path macos -c release
            swift test --package-path macos -c release
          else
            echo "::notice::macos 工程尚未创建，跳过构建"
          fi

  # ---------- Android ----------
  android:
    name: Android (Kotlin/Compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      # 尚未创建 android 工程时不装 SDK —— 装 SDK 要下载数 GB 且需要接受
      # 许可协议，既慢又容易因许可步骤失败而让整个 job 变红，
      # 而此时根本没有东西需要构建。
      - name: 检查 android 工程是否存在
        id: has_android
        run: |
          if [ -f android/gradlew ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::android 工程尚未创建，跳过 SDK 安装与构建"
          fi
      - uses: actions/setup-java@v4
        if: steps.has_android.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 并接受许可协议
        if: steps.has_android.outputs.exists == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: 构建并测试
        if: steps.has_android.outputs.exists == 'true'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug test --no-daemon

  # ---------- iOS ----------
  ios:
    name: iOS (Swift/SwiftUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 构建并测试（未签名）
        run: |
          if [ -d ios ]; then
            xcodebuild build -project ios/ios.xcodeproj -scheme ios \\
              -destination "generic/platform=iOS" -configuration Release \\
              CODE_SIGNING_ALLOWED=NO
          else
            echo "::notice::ios 工程尚未创建，跳过构建"
          fi
