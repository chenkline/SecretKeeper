name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # 每日定时全量构建，用于发现上游依赖的破坏性变更
    - cron: "17 3 * * *"

jobs:
  # ---------- 黄金测试向量校验（关键路径）----------
  vectors:
    name: 向量校验
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验向量自洽性
        run: python scripts/verify-vectors.py
      - name: 分层依赖门禁
        run: python scripts/check-layering.py
      # 注意：不能用「重新生成后 git diff」检测向量是否被改动。
      # gen-vectors.py 中 GCM nonce 与 RSA-OAEP 种子均为随机，每次生成必然不同，
      # diff 永远失败。向量一旦提交即视为基准，任何变更必须人工评审后显式重新生成。


  # ---------- Windows ----------
  windows:
    name: Windows (C++/FLTK)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 分层依赖门禁
        run: python scripts/check-layering.py
      - name: 定位 MSVC 环境
        shell: pwsh
        run: |
          # runner 镜像里的 VS 版本与 SKU 会随镜像更新变化（Enterprise /
          # Community / Professional 都出现过），写死路径迟早会失效。
          # 因此优先用官方的 vswhere 查询，失败再退回递归搜索。
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsdev = $null
          if (Test-Path $vswhere) {
            $install = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if ($install) {
              $candidate = Join-Path $install "Common7\Tools\VsDevCmd.bat"
              if (Test-Path $candidate) { $vsdev = $candidate }
            }
          }
          if (-not $vsdev) {
            $root = "${env:ProgramFiles(x86)}\Microsoft Visual Studio"
            if (Test-Path $root) {
              $vsdev = Get-ChildItem -Path $root -Filter VsDevCmd.bat `
                -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match "\\Common7\\Tools\\VsDevCmd\.bat$" } |
                Select-Object -First 1 -ExpandProperty FullName
            }
          }
          if (-not $vsdev) {
            Write-Host "::error::未找到 VsDevCmd.bat，MSVC 环境不可用"; exit 1
          }
          "VSDEVCMD=$vsdev" >> $env:GITHUB_ENV
          Write-Host "MSVC: $vsdev"
      - name: 编译四层自检程序
        shell: cmd
        run: |
          call "%VSDEVCMD%"
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/build.ps1 -Test -CompileOnly
      - name: 执行四层自检
        shell: cmd
        run: |
          call "%VSDEVCMD%"
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/run-tests.ps1 -Architecture x64 -Root .

      - name: 生成跨平台一致性探针
        shell: cmd
        run: |
          call "%VSDEVCMD%"
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/build.ps1 -Conformance -Architecture x64
          windows\build\x64\crypto_conformance.exe > conformance-windows.txt
          type conformance-windows.txt
      - name: 上传一致性 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-windows
          path: conformance-windows.txt
          if-no-files-found: error
      - name: 上传测试日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-crypto-test
          path: windows/build/
          if-no-files-found: ignore

  # ---------- Windows ARM64 ----------
  # 本机 BuildTools 缺 VC.Tools.ARM64 组件，且用户禁止在开发机上安装任何
  # 新组件，因此 ARM64 交叉编译完全交给 runner。
  #
  # runner 镜像是否预装 ARM64 交叉工具链并无可靠保证（镜像曾出现过只有 x64
  # 工具、链接 aarch64-pc-windows-msvc 失败的情况），所以这里不假设预装：
  # 先探测，缺失再用 VS 安装器补装该组件。该操作是幂等的 modify。
  windows-arm64:
    name: Windows ARM64 (交叉编译)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 确保 ARM64 交叉工具链
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if ($install) {
            Write-Host "ARM64 tools already installed: $install"
            "ARM64READY=true" >> $env:GITHUB_ENV
            exit 0
          }
          Write-Host "::notice::ARM64 工具缺失，正在通过 VS 安装器补装（幂等 modify）"
          $installer = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            Write-Host "::error::找不到 vs_installer.exe，无法补装 ARM64 工具"
            exit 1
          }
          & $installer modify `
            --installPath $install `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --quiet --norestart --nocache
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::补装 ARM64 工具失败，退出码 $LASTEXITCODE"
            exit 1
          }
          "ARM64READY=true" >> $env:GITHUB_ENV
      - name: 定位 MSVC 环境
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            -property installationPath
          if (-not $install) {
            Write-Host "::error::补装后仍找不到带 ARM64 工具的 VS 实例"
            exit 1
          }
          $vsdev = Join-Path $install "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsdev)) {
            Write-Host "::error::未找到 VsDevCmd.bat"
            exit 1
          }
          "VSDEVCMD=$vsdev" >> $env:GITHUB_ENV
          Write-Host "MSVC(arm64): $vsdev"
      - name: 交叉编译四层自检程序
        shell: cmd
        run: |
          call "%VSDEVCMD%" -arch=arm64 -host_arch=x64
          chcp 65001 >nul
          pwsh -NoProfile -File windows/scripts/build.ps1 -Architecture arm64 -CompileOnly
      - name: 上传交叉编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-build
          path: windows/build/
          if-no-files-found: ignore

  # ---------- Windows UI (WinUI 3) ----------
  # UI 工程只能在带完整 VS + Windows App SDK + MSIX 工具链的 runner 上构建。
  # 本机 BuildTools 缺这些组件且约定不补装，因此 UI 构建完全交给 CI。
  # ---------- Windows 图形界面 ----------
  # FLTK 为纯静态库 + /MT 运行库，产物是单文件 exe，无第三方 DLL。
  # 这里只验证「能构建」；界面行为无法在无显示环境的 runner 上验证，
  # 因此交互逻辑仍由本地手工验证，功能正确性由四层自检与黄金向量保证。
  windows-ui:
    name: Windows UI (FLTK + CMake)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: 配置
        shell: pwsh
        run: |
          cmake -S . -B build/windows/x64 -A x64
      - name: 构建
        shell: pwsh
        run: |
          cmake --build build/windows/x64 --config Release --parallel
      - name: 校验产物无第三方 DLL 依赖
        shell: pwsh
        run: |
          $exe = "build/windows/x64/Release/SecretKeeper.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::未产出 SecretKeeper.exe"; exit 1
          }
          $dumpbin = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft Visual Studio" `
            -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "bin\\Hostx64\\x64" } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dumpbin) { Write-Host "::warning::dumpbin 不可用，跳过依赖检查"; exit 0 }
          # 只允许系统 DLL；出现 fltk/msvcp/vcruntime 等即说明静态链接失败。
          $allowed = @("bcrypt","COMCTL32","WS2_32","KERNEL32","USER32","GDI32",
                       "SHELL32","ole32","COMDLG32","ADVAPI32","api-ms-win-crt")
          $deps = & $dumpbin /dependents $exe | Select-String -Pattern "\.dll"
          $bad = @()
          foreach ($d in $deps) {
            $name = ($d.ToString() -split "\s+")[-1]
            if ($allowed -notcontains [System.IO.Path]::GetFileNameWithoutExtension($name)) {
              $bad += $name
            }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::存在非系统 DLL 依赖: $($bad -join ', ')"; exit 1
          }
          Write-Host "依赖检查通过：无第三方 DLL"
      - name: 上传构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-build
          path: build/windows/x64/Release/SecretKeeper.exe
          if-no-files-found: warn

  # ---------- Linux ----------
  # 与 Windows / macOS 共用 src/common、src/include 与根 CMakeLists.txt，
  # 因此这里复跑的是同一份核心代码，跨端一致性由此保证。
  linux:
    name: Linux (C++/FLTK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 分层依赖门禁
        run: python scripts/check-layering.py
      # FLTK 在 X11 下需要这组头文件；libdecor/libdecor 会自动探测，缺失即跳过。
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libx11-dev libxext-dev libxft-dev libxinerama-dev \
            libxcursor-dev libxrender-dev libfontconfig1-dev libfreetype6-dev \
            libgl1-mesa-dev libglu1-mesa-dev
      - name: 配置
        run: cmake -S . -B build/linux/x64 -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: 构建并测试
        run: |
          cmake --build build/linux/x64 --parallel
          ctest --test-dir build/linux/x64 --output-on-failure
      - name: 生成跨平台一致性探针
        run: ./build/linux/x64/Release/sk_crypto_conformance | tee conformance-linux.txt
      - name: 上传一致性 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-linux
          path: conformance-linux.txt
          if-no-files-found: error


  # ---------- macOS ----------
  macos:
    name: macOS (C++/FLTK)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 分层依赖门禁
        run: python scripts/check-layering.py
      - name: 配置
        # 与 Linux job 对齐使用 Ninja。macOS runner 上 CMake 默认落到 Makefile
        # 生成器，Apple Silicon 只有 3 核，FLTK 的三百多个源文件被串行编译，
        # 整个 job 要 16 分钟；换 Ninja 后与 Linux 一样两分钟内完成。
        run: cmake -S . -B build/macos/arm64 -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: 构建并测试
        run: |
          cmake --build build/macos/arm64 --parallel
          ctest --test-dir build/macos/arm64 --output-on-failure
      - name: 生成跨平台一致性探针
        run: ./build/macos/arm64/Release/sk_crypto_conformance | tee conformance-macos.txt
      - name: 上传一致性 transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-macos
          path: conformance-macos.txt
          if-no-files-found: error

  # ---------- Android ----------
  # ---------- 跨平台一致性比对 ----------
  # 三个原生平台的探针 transcript 在这里逐行比对。verify-vectors.py 只能
  # 证明「向量本身自洽」（用独立的 Python 实现重算一遍），证明不了
  # 「各平台的 C++ 实现真的产出了同样的字节」。这一步跑的是实际交付的
  # 代码，因此才是端到端的一致性证据。
  conformance:
    name: 跨平台一致性比对
    needs: [windows, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 下载各平台 transcript
        uses: actions/download-artifact@v4
        with:
          path: transcripts
      - name: 比对
        run: >
          python scripts/compare-conformance.py
          transcripts/conformance-windows/conformance-windows.txt
          transcripts/conformance-linux/conformance-linux.txt
          transcripts/conformance-macos/conformance-macos.txt

  android:
    name: Android (Kotlin/Compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 分层依赖门禁
        run: python scripts/check-layering.py
      # 尚未创建 android 工程时不装 SDK —— 装 SDK 要下载数 GB 且需要接受
      # 许可协议，既慢又容易因许可步骤失败而让整个 job 变红，
      # 而此时根本没有东西需要构建。
      - name: 检查 android 工程是否存在
        id: has_android
        run: |
          if [ -f android/gradlew ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "::notice::android 工程尚未创建，跳过 SDK 安装与构建"
          fi
      - uses: actions/setup-java@v4
        if: steps.has_android.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - name: 安装 Android SDK 并接受许可协议
        if: steps.has_android.outputs.exists == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: 构建并测试
        if: steps.has_android.outputs.exists == 'true'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug test --no-daemon

  # ---------- iOS ----------
  ios:
    name: iOS (Swift/SwiftUI)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装向量校验依赖
        run: pip install "argon2-cffi>=23.1" "cryptography>=42"
      - name: 校验黄金向量
        run: python scripts/verify-vectors.py
      - name: 分层依赖门禁
        run: python scripts/check-layering.py
      - name: 构建并测试（未签名）
        run: |
          if [ -d ios ]; then
            xcodebuild build -project ios/ios.xcodeproj -scheme ios \\
              -destination "generic/platform=iOS" -configuration Release \\
              CODE_SIGNING_ALLOWED=NO
          else
            echo "::notice::ios 工程尚未创建，跳过构建"
          fi
